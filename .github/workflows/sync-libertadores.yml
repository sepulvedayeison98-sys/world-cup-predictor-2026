name: Sync Copa Libertadores (API-Football)

# Diario 04:00 UTC: ingesta calendario/resultados de Copa Libertadores y
# recalibra su ELO (mismo motor walk-forward que las ligas, ver
# services/sync/league-calibrate.ts). Ronda de eliminación directa activa
# hasta el 26 de agosto — diario mantiene ELO y predicciones al día sin
# gastar cuota de más (la ingesta usa solo 3 requests).
# Requiere secret: CRON_SECRET.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  libertadores:
    runs-on: ubuntu-latest
    steps:
      - name: Ingesta + calibración de Copa Libertadores
        env:
          APP_URL: 'https://world-cup-predictor-2026-flax.vercel.app'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          CRON_SECRET="$(printf %s "$CRON_SECRET" | tr -d '[:space:]')"
          AUTH="Authorization: Bearer $CRON_SECRET"
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            "$APP_URL/api/sync/libertadores/ingest" -H "$AUTH" \
            || { echo "::warning::Ingesta de Libertadores falló tras reintentos."; exit 0; }
          curl -fsS --retry 3 --retry-delay 15 --retry-all-errors --max-time 120 \
            "$APP_URL/api/sync/libertadores/calibrate" -H "$AUTH" \
            || { echo "::warning::Calibración de Libertadores falló tras reintentos."; exit 0; }
