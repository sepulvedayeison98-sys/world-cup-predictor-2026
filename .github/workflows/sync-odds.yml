name: Sync cuotas (Pinnacle vía The Odds API)

# Trae las cuotas de Pinnacle de las competiciones EN CURSO y recalcula las
# value bets. Reactivado tras sacar services/sync/odds.ts del Mundial.
#
# ── Cadencia y coste ──────────────────────────────────────────────────────
# Cada llamada a /odds cuesta (regiones × mercados) = 1 × 2 = 2 créditos, y
# el plan gratuito son 500 al mes. El sync solo pide las competiciones con
# partido dentro de las próximas 72 h, así que el gasto depende del
# calendario: un día sin fútbol cuesta 0 y un sábado con las siete puede
# costar 14.
#
# Cuatro corridas al día es el techo prudente mientras no sepamos el plan
# real de la cuenta: en el peor caso —las siete competiciones con partido
# todos los días— serían 56 créditos diarios, que se pasarían de 500. Por eso
# el propio sync lee `x-requests-remaining` de la respuesta y se detiene si
# baja de ODDS_MIN_CREDITS (25 por defecto), dejándolo anotado en sync_logs.
# Con los créditos reales a la vista se ajusta esta cadencia.
#
# La recalibración ya NO se encadena aquí: recalibrate.ts sigue fijado al
# Mundial archivado y no tiene nada que hacer.
#
# Requiere los secrets del repo: CRON_SECRET. La clave de The Odds API
# (ODDS_API_KEY) vive en Vercel.

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar cuotas Pinnacle y derivar CO
        env:
          APP_URL: 'https://world-cup-predictor-2026-flax.vercel.app'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          CRON_SECRET="$(printf %s "$CRON_SECRET" | tr -d '[:space:]')"
          curl -fsS --retry 3 --retry-delay 12 --retry-all-errors --max-time 180 \
            "$APP_URL/api/sync/odds" -H "Authorization: Bearer $CRON_SECRET" \
            || { echo "::warning::Sync de cuotas falló tras reintentos."; exit 0; }
