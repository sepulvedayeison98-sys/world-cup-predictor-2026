name: Sync cuotas + recalibracion (Mundial, archivado)

# DETENIDO — el Mundial 2026 se archivó y las dos llamadas de este workflow
# solo trabajaban sobre él:
#
#   · /api/sync/odds        → services/sync/odds.ts está fijado al Mundial en
#     dos sitios: ODDS_API_SPORT cae por defecto en 'soccer_fifa_world_cup' y
#     la consulta filtra .eq('competition_id', COMPETITION_ID). Las últimas
#     cuotas que trajo son del 19 de julio.
#   · /api/sync/recalibrate → services/sync/recalibrate.ts recorre solo los
#     partidos del Mundial. Con los 104 terminados, cada corrida recorría las
#     filas y salía sin escribir nada (el guard de partido jugado).
#
# Sin `schedule:` no vuelve a dispararse solo. Se conserva el
# `workflow_dispatch` y el archivo entero para no perder el punto de partida
# de la decisión pendiente: llevar el detector de cuotas a las ligas en curso
# exige mapear cada una a su clave de deporte en The Odds API y confirmar la
# cuota de la cuenta. Cuando se haga, esto vuelve a tener un cron.

on:
  workflow_dispatch:

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar cuotas Pinnacle y derivar CO
        env:
          APP_URL: 'https://world-cup-predictor-2026-flax.vercel.app'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          CRON_SECRET="$(printf %s "$CRON_SECRET" | tr -d '[:space:]')"
          AUTH="Authorization: Bearer $CRON_SECRET"
          curl -fsS --retry 3 --retry-delay 12 --retry-all-errors --max-time 180 \
            "$APP_URL/api/sync/odds" -H "$AUTH" \
            || { echo "::warning::Sync de cuotas fallo tras reintentos."; exit 0; }
          curl -fsS --retry 3 --retry-delay 12 --retry-all-errors --max-time 120 \
            "$APP_URL/api/sync/recalibrate" -H "$AUTH" \
            || { echo "::warning::Recalibracion fallo tras reintentos."; exit 0; }
