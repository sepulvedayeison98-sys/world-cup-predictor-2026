name: Simulacion Monte Carlo (Mundial, archivado)

# DETENIDO — la simulación Monte Carlo proyecta el CUADRO del Mundial 2026
# (probabilidad de título por selección, avance por fase) y el torneo se
# archivó. Con los 104 partidos jugados la simulación no tiene nada que
# proyectar: reescribía las mismas 11.328 filas de tournament_simulations
# cada 6 horas para un campeón que ya se conoce.
#
# Las páginas que la consumían (/champion, /simulation) se archivaron con el
# torneo y redirigen a /mundial.
#
# Sin `schedule:` no vuelve a dispararse solo. El archivo se conserva —y con
# él lib/simulationEngine.ts y /api/simulate— porque el siguiente torneo de
# formato copa lo necesita tal cual.

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Correr simulacion del torneo
        env:
          APP_URL: 'https://world-cup-predictor-2026-flax.vercel.app'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          CRON_SECRET="$(printf %s "$CRON_SECRET" | tr -d '[:space:]')"
          curl -fsS --retry 3 --retry-delay 12 --retry-all-errors --max-time 180 \
            "$APP_URL/api/simulate" -H "Authorization: Bearer $CRON_SECRET" \
            || { echo "::warning::Simulacion fallo tras reintentos."; exit 0; }
