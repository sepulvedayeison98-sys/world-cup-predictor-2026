name: Sync Smart Bets

# Congela el top-5 pre-partido y califica los picks de los partidos que ya
# terminaron.
#
# ── Por qué existe ────────────────────────────────────────────────────────
# `/api/sync/smart-bets` existía desde hace tiempo pero NADA lo programaba.
# Solo corría encadenado a otras cosas:
#
#   · post-result.ts        → cadena del Mundial, terminado en julio
#   · nba-calibrate         → solo NBA
#   · calibrateLeagues(…, withSmartBets) → la bandera va en false por
#     defecto y el workflow de ligas no la pasa (se desacopló cuando el
#     proceso tardaba ~160 s y reventaba el techo de 60 s de Vercel)
#
# Resultado: las recomendaciones se quedaban congeladas. Se detectó con una
# instantánea de casi 24 horas de antigüedad y partidos del día siguiente
# sin una sola recomendación.
#
# ── Por qué ahora sí cabe ─────────────────────────────────────────────────
# Aquel problema de los 160 s lo resolvió la reescritura por lotes de
# services/smartBetTracking.ts: el número de consultas depende de cuántas
# COMPETICIONES hay, no de cuántos partidos. Medido hoy: 1.290 partidos y
# 5.045 recomendaciones en 7,0 s, más 1,4 s de calificación. Muy dentro del
# techo de 60 s.
#
# ── Coste ─────────────────────────────────────────────────────────────────
# Cero cuota de API: trabaja solo contra la base. Doce corridas al día.
#
# Va a y media para caer DESPUÉS del refresco de resultados de la hora en
# punto: calificar un pick necesita que el partido ya figure como terminado.

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

jobs:
  smart-bets:
    runs-on: ubuntu-latest
    steps:
      - name: Instantánea pre-partido + calificación
        env:
          APP_URL: 'https://world-cup-predictor-2026-flax.vercel.app'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          CRON_SECRET="$(printf %s "$CRON_SECRET" | tr -d '[:space:]')"
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 120 \
            "$APP_URL/api/sync/smart-bets" \
            -H "Authorization: Bearer $CRON_SECRET" \
            || { echo "::warning::El sync de Smart Bets falló tras reintentos."; exit 0; }
